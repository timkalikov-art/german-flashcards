<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css?v=20261011a">
</head>

<body>

<!-- ===== TOP BAR ===== -->
<header class="topbar">
  <button id="menuBtn" class="menu-btn">☰</button>
</header>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar" id="sidebar">

  <h3>Меню</h3>

  <!-- импорт -->
  <label class="file-upload hidden-menu-item">
    <input type="file" id="fileInput" accept=".json">
    <div class="file-btn">📂 Выбрать файл</div>
    <div id="fileName">Файл не выбран</div>
  </label>

  <!-- уровень -->
  <div class="menu-section hidden-menu-item">
    <label>Уровень</label>
    <select id="levelSelect">
      <option value="A1">A1</option>
      <option value="A2">A2</option>
      <option value="B1">B1</option>
      <option value="B2">B2</option>
      <option value="C1">C1</option>
    </select>
  </div>

  <!-- категория -->
  <div class="menu-section">
    <label>Категория</label>
    <select id="topicSelect"></select>
  </div>

  <!-- режим -->
  <div class="menu-section">
    <label>Режим</label>
    <select id="modeSelect">
      <option value="category">Категория</option>
      <option value="favorites">Избранное</option>
    </select>
  </div>

</div> <!-- ЗАКРЫВАЕМ SIDEBAR -->

<div class="overlay" id="overlay"></div>


<!-- ===== MAIN ===== -->
<main class="container">

  <div class="card" id="card">
    <div class="card-inner" id="cardInner">

      <div class="card-front">
        <span id="word">Выберите категорию</span>
      </div>

      <div class="card-back">
        <span id="translation"></span>
      </div>

    </div>
  </div>

  <div class="buttons">
    <button id="knowBtn" class="primary">Знаю</button>
    <button id="repeatBtn" class="secondary-btn">Повторить</button>
    <button id="undoBtn" class="secondary-btn">Назад</button>
    <button id="shuffleBtn" class="secondary-btn">Перемешать</button>
    <button id="favoriteBtn" class="secondary-btn favorite-btn" aria-label="Добавить в избранное">☆</button>
  </div>

  <p id="stats">0 / 0</p>

  <div class="progress-track" aria-label="Прогресс категории">
    <div id="progressBar" class="progress-bar"></div>
  </div>
  <p id="progressDetails" class="progress-details">Изучено 0 из 0 · осталось 0</p>

  <button id="openStats" class="secondary-btn">Статистика</button>

</main>

<!-- ===== MODAL ===== -->
<div class="modal" id="statsModal">
  <div class="modal-content">
    <h2>Статистика</h2>
    <p id="modalStats"></p>
    <button id="closeStats" class="secondary-btn">Закрыть</button>
  </div>
</div>

<!-- ===== THEME ===== -->
<button id="themeToggle" class="theme-toggle">☀️</button>

<script src="data_verified.js?v=20261011c"></script>
<script src="script.js?v=20261011b"></script>

</body>
</html>
